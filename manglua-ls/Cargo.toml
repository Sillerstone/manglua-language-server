[package]
name = "manglua-ls"
version = "0.1.0"
edition = "2024"

[dependencies]
ropey = "1.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-lsp-server = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tree-sitter = "0.27.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
